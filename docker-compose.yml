services:
  producer-csv:
    container_name: producer-csv
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "main_csv.py", "-f", "merged/latency_data.csv", "-i", "0.5", "-s", "5", "-y", "network_trafic", "-ho" , "producer-csv", "-p", "8001"]
    environment:
      PORT: ${PORT:-8001}
    ports:
      - "${PORT:-8001}:${PORT:-8001}"
    networks:
      - nwdaf-network

networks:
  nwdaf-network:
    external: true
